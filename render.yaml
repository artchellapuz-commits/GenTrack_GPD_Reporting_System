services:
  - type: web
    name: npc-reporting-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn npc_reporting.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/
    plan: free
    pythonVersion: "3.11"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "npc-reporting-backend.onrender.com"
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.console.EmailBackend"
